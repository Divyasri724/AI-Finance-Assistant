{% extends "base.html" %}

{% block title %}Register | AI Finance Assistant{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Create Account</h1>
    <p>Register to manage your finances.</p>

    <form method="POST">

        <label>Full Name</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>

</div>

{% endblock %}
