{% extends "base.html" %}

{% block title %}Expense Prediction{% endblock %}

{% block content %}

<h1>Expense Prediction</h1>

<div class="card balance">
    <h3>Predicted Next Month Expenses</h3>
    <h2>₹{{ "%.2f"|format(forecast) }}</h2>
</div>

<div class="section">
    <h2>Monthly Expense History</h2>

    <canvas
        id="predictionChart"
        data-labels='{{ labels | tojson }}'
        data-values='{{ values | tojson }}'>
    </canvas>
</div>

<script>
const chartElement = document.getElementById("predictionChart");

const labels = JSON.parse(chartElement.dataset.labels);
const values = JSON.parse(chartElement.dataset.values);

new Chart(chartElement, {
    type: "line",
    data: {
        labels: labels,
        datasets: [{
            label: "Monthly Expenses",
            data: values,
            borderWidth: 2,
            tension: 0.3
        }]
    },
    options: {
        responsive: true
    }
});
</script>

<p class="note">
    This prediction is an estimate based on your recorded expenses.
</p>

{% endblock %}
