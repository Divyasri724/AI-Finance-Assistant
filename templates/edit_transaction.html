{% extends "base.html" %}

{% block title %}Edit Transaction{% endblock %}

{% block content %}

<div class="form-card">
    <h1>Edit Transaction</h1>

    <form method="POST">

        <label>Description</label>
        <input type="text" name="description"
               value="{{ record.description }}" required>

        <label>Amount (₹)</label>
        <input type="number" name="amount"
               value="{{ record.amount }}"
               min="0.01" step="0.01" required>

        <label>Transaction Type</label>
        <select name="type" required>
            <option value="Income"
                {% if record.type == "Income" %}selected{% endif %}>
                Income
            </option>

            <option value="Expense"
                {% if record.type == "Expense" %}selected{% endif %}>
                Expense
            </option>
        </select>

        <label>Category</label>
        <select name="category" required>
            {% for category in categories %}
            <option value="{{ category }}"
                {% if record.category == category %}selected{% endif %}>
                {{ category }}
            </option>
            {% endfor %}
        </select>

        <label>Date</label>
        <input type="date" name="date"
               value="{{ record.date }}" required>

        <button type="submit">Update Transaction</button>

    </form>
</div>

{% endblock %}
