{% extends "base.html" %}

{% block title %}Login | AI Finance Assistant{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Welcome Back!</h1>
    <p>Login to access your AI Finance Assistant.</p>

    <form method="POST">

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>

</div>

{% endblock %}
